# A pairing address on 127.0.0.1 names the phone itself. With nothing listening there, pairing
# must explain that within 15 seconds instead of spinning.
appId: com.libraos.next
name: A loopback pairing address is explained, not retried forever
---
# Saved environments live in the iOS keychain, which clearState keeps.
- runFlow:
    when:
      platform: iOS
    commands:
      - clearKeychain
- launchApp:
    clearState: true
    permissions:
      all: deny
- extendedWaitUntil:
    visible: "Pair with your computer"
    timeout: 30000
- tapOn: "Add environment"
- extendedWaitUntil:
    visible: "Address"
    timeout: 10000
- tapOn: "Address"
- inputText: "127.0.0.1:9"
# As in pair-and-engine.yaml: on Android a tap on the "Code" label leaves focus in Address, so tap
# the field by its placeholder, with the keyboard hidden first.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: "Pairing code"
- inputText: "LOOPBACK0000"
- pressKey: Enter
- extendedWaitUntil:
    visible: "This address reaches only this device.*"
    timeout: 15000
- takeScreenshot: pairing-loopback-dark
