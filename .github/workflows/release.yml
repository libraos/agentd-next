name: Release

# A tag v<version> (apps/desktop/package.json) builds every installer and the updater manifests and
# puts them in a draft release that a person reviews and publishes; installed apps update to the
# latest published release. workflow_dispatch builds the same files as workflow artifacts only.
# Unsigned (decided 2026-11-18): no secrets beyond GITHUB_TOKEN; macOS is ad-hoc signed, not notarized.
on:
  push:
    tags:
      # Releases only: a suffixed tag (v0.2.1-preview.20261121.1) must never feed the updater.
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      agentd_release:
        description: "libraos/agentd release to bundle, e.g. v0.1.13 (empty: the latest)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Version and agentd release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      agentd_release: ${{ steps.agentd.outputs.release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: apps/desktop/package.json
          sparse-checkout-cone-mode: false
      - name: Resolve version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./apps/desktop/package.json").version')
          if [ "$EVENT" = push ] && [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match v$version (apps/desktop/package.json)"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Resolved once so every installer carries the same agentd.
      - name: Resolve agentd release
        id: agentd
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE: ${{ inputs.agentd_release }}
          VAR_RELEASE: ${{ vars.AGENTD_RELEASE }}
        run: |
          release=${INPUT_RELEASE:-$VAR_RELEASE}
          release=${release:-$(gh release view -R libraos/agentd --json tagName -q .tagName)}
          gh release view "$release" -R libraos/agentd --json tagName -q .tagName
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            # Pinned: native modules built on a newer glibc (ubuntu-latest is 26.04, glibc 2.42)
            # exceed the 2.39 ceiling the build checks, so they would not load on older distros.
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
          - label: Windows x64
            runner: windows-latest
            platform: win
            arch: x64
            rust_target: x86_64-pc-windows-msvc
          - label: macOS arm64
            runner: macos-26
            platform: mac
            arch: arm64
            rust_target: aarch64-apple-darwin
          # macOS 26 images default to Xcode 26, which the Apple Speech helper needs.
          - label: macOS x64
            runner: macos-26-intel
            platform: mac
            arch: x64
            rust_target: x86_64-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
      # The resource monitor's sysinfo needs Rust 1.95 or newer; same toolchain as the local image.
      - name: Install Rust
        run: |
          rustup toolchain install 1.100.0 --profile minimal --target "${{ matrix.rust_target }}"
          rustup default 1.100.0
      - name: Install Linux build libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick \
            libgtk-3-0t64 libnss3 libasound2t64 libgbm1
      - name: Build installer
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTD_BUILD_ON_HOST: "1"
          AGENTD_RELEASE: ${{ needs.prepare.outputs.agentd_release }}
          T3CODE_DESKTOP_VERBOSE: "1"
        run: bash agentd/scripts/build-desktop.sh "${{ matrix.platform }}" "${{ matrix.arch }}"
      # electron-builder names both macOS arches' manifest latest-mac.yml; the release job merges them.
      - name: Name the macOS x64 updater manifest
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        run: mv release/latest-mac.yml release/latest-mac-x64.yml
      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/LibraOS-Next-x86_64.AppImage
            release/LibraOS-Next-${{ needs.prepare.outputs.version }}-*.deb
            release/LibraOS-Next-${{ needs.prepare.outputs.version }}-*.exe
            release/LibraOS-Next-${{ needs.prepare.outputs.version }}-*.dmg
            release/LibraOS-Next-${{ needs.prepare.outputs.version }}-*.zip
            release/LibraOS-Next-*.blockmap
            release/latest*.yml
          if-no-files-found: error
          compression-level: 0

  checksums:
    name: SHA256SUMS
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      # The updater reads one latest-mac.yml and picks the file for its arch.
      - name: Merge the macOS updater manifests
        run: |
          node scripts/merge-update-manifests.ts --platform mac \
            dist/latest-mac.yml dist/latest-mac-x64.yml dist/latest-mac.yml
          rm dist/latest-mac-x64.yml
      - name: Check every installer and manifest is there and write SHA256SUMS
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd dist
          for f in LibraOS-Next-x86_64.AppImage "LibraOS-Next-$VERSION-amd64.deb" \
            "LibraOS-Next-$VERSION-x64.exe" "LibraOS-Next-$VERSION-arm64.dmg" \
            "LibraOS-Next-$VERSION-x64.dmg" "LibraOS-Next-$VERSION-arm64.zip" \
            "LibraOS-Next-$VERSION-x64.zip" latest.yml latest-linux.yml latest-mac.yml; do
            test -s "$f" || { echo "::error::missing $f"; ls -l; exit 1; }
          done
          for m in latest.yml latest-linux.yml latest-mac.yml; do
            grep -Eq "^version: '?$VERSION'?\$" "$m" || { echo "::error::$m is not $VERSION"; cat "$m"; exit 1; }
          done
          sha256sum LibraOS-Next-* > SHA256SUMS
          cat SHA256SUMS latest-mac.yml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            dist/LibraOS-Next-*
            dist/latest*.yml
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  release:
    name: Draft release
    if: github.event_name == 'push'
    needs: [prepare, checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          AGENTD_RELEASE: ${{ needs.prepare.outputs.agentd_release }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          cat > notes.md <<EOF
          LibraOS Next $VERSION, with LibraOS Core (agentd) $AGENTD_RELEASE and its Skills inside.

          **Which file to download**

          - macOS, Apple silicon (M1 or later): \`LibraOS-Next-$VERSION-arm64.dmg\`
          - macOS, Intel: \`LibraOS-Next-$VERSION-x64.dmg\`
          - Windows: \`LibraOS-Next-$VERSION-x64.exe\`
          - Linux: \`LibraOS-Next-x86_64.AppImage\`, or \`LibraOS-Next-$VERSION-amd64.deb\` on Debian and Ubuntu

          Not sure which Mac you have? Apple menu → About This Mac: "Chip: Apple M…" is Apple silicon, "Processor: Intel" is Intel.
          The \`.zip\`, \`.blockmap\` and \`latest*.yml\` files are for automatic updates; you don't need them.

          These builds are not signed yet:

          - **macOS:** the app is not notarized. The first time, right-click LibraOS Next in Applications and choose Open, or open System Settings → Privacy & Security and click Open Anyway.
          - **Windows:** SmartScreen may warn. Click More info, then Run anyway.

          The app checks for updates at launch and every four hours and asks before installing. On macOS it opens this page instead; install the new version by hand. 0.1.10-agentd.8 and earlier do not check: install this version by hand once.

          Coming from AgentD Next (the earlier name)? LibraOS Next is a new app beside it: the first start copies its window settings and sign-in, and threads, settings and the background service carry over. Once LibraOS Next works, uninstall AgentD Next (on macOS, delete it from Applications); its data is left in place.

          Check a download against \`SHA256SUMS\`.
          EOF
          gh release create "$TAG" -R "$REPO" --draft --verify-tag \
            --title "LibraOS Next $VERSION" --notes-file notes.md \
            LibraOS-Next-* latest*.yml SHA256SUMS
