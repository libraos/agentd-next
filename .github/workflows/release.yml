name: Release

# A tag v<version> (apps/desktop/package.json) builds every installer and the updater manifests and
# puts them in a draft release that a person reviews and publishes; installed apps update to the
# latest published release. workflow_dispatch builds the same files as workflow artifacts only.
# Signing (#280): only the Windows job signs, with Azure Artifact Signing, and only it runs in the
# agentd-signing environment, whose Azure ids are the only secrets beyond GITHUB_TOKEN. macOS is
# ad-hoc signed, not notarized; Linux is unsigned.
on:
  push:
    tags:
      # Releases only: a suffixed tag (v0.2.1-preview.20261121.1) must never feed the updater.
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      agentd_release:
        description: "libraos/engine release to bundle, e.g. v0.1.13 (empty: the latest)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Version and agentd release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      agentd_release: ${{ steps.agentd.outputs.release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: apps/desktop/package.json
          sparse-checkout-cone-mode: false
      - name: Resolve version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./apps/desktop/package.json").version')
          if [ "$EVENT" = push ] && [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match v$version (apps/desktop/package.json)"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Resolved once so every installer carries the same agentd.
      - name: Resolve agentd release
        id: agentd
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE: ${{ inputs.agentd_release }}
          VAR_RELEASE: ${{ vars.AGENTD_RELEASE }}
        run: |
          release=${INPUT_RELEASE:-$VAR_RELEASE}
          release=${release:-$(gh release view -R libraos/engine --json tagName -q .tagName)}
          gh release view "$release" -R libraos/engine --json tagName -q .tagName
          echo "release=$release" >> "$GITHUB_OUTPUT"

  # Windows is build-windows below.
  build:
    name: Build ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            # Pinned: native modules built on a newer glibc (ubuntu-latest is 26.04, glibc 2.42)
            # exceed the 2.39 ceiling the build checks, so they would not load on older distros.
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
          - label: macOS arm64
            runner: macos-26
            platform: mac
            arch: arm64
            rust_target: aarch64-apple-darwin
          # macOS 26 images default to Xcode 26, which the Apple Speech helper needs.
          - label: macOS x64
            runner: macos-26-intel
            platform: mac
            arch: x64
            rust_target: x86_64-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
      # The resource monitor's sysinfo needs Rust 1.95 or newer; same toolchain as the local image.
      - name: Install Rust
        run: |
          rustup toolchain install 1.100.0 --profile minimal --target "${{ matrix.rust_target }}"
          rustup default 1.100.0
      - name: Install Linux build libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick \
            libgtk-3-0t64 libnss3 libasound2t64 libgbm1
      - name: Build installer
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTD_BUILD_ON_HOST: "1"
          AGENTD_RELEASE: ${{ needs.prepare.outputs.agentd_release }}
          T3CODE_DESKTOP_VERBOSE: "1"
        run: bash agentd/scripts/build-desktop.sh "${{ matrix.platform }}" "${{ matrix.arch }}"
      # electron-builder names both macOS arches' manifest latest-mac.yml; the release job merges them.
      - name: Name the macOS x64 updater manifest
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        run: mv release/latest-mac.yml release/latest-mac-x64.yml
      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/LibraOS-Next-x86_64.AppImage
            release/LibraOS-Next-${{ needs.prepare.outputs.version }}-*.deb
            release/LibraOS-Next-${{ needs.prepare.outputs.version }}-*.exe
            release/LibraOS-Next-${{ needs.prepare.outputs.version }}-*.dmg
            release/LibraOS-Next-${{ needs.prepare.outputs.version }}-*.zip
            release/LibraOS-Next-*.blockmap
            release/latest*.yml
          if-no-files-found: error
          compression-level: 0

  # Its own job, not a matrix entry: job permissions and the environment cannot vary by matrix
  # entry, and the Linux and macOS builds must get neither an OIDC token nor any signing variable
  # (T3CODE_DESKTOP_SIGNED on macOS turns on certificate discovery).
  build-windows:
    name: Build Windows x64
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    environment: agentd-signing
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
      - name: Install Rust
        run: |
          rustup toolchain install 1.100.0 --profile minimal --target x86_64-pc-windows-msvc
          rustup default 1.100.0
      # electron-builder signs through Invoke-TrustedSigning, whose DefaultAzureCredential falls
      # back to this Azure CLI login.
      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Signing starts near the end of the build, after the GitHub OIDC assertion the CLI logged in
      # with has expired, so a token first asked for then fails (AADSTS700024). Asked for now, it is
      # cached for about an hour and the CLI credential reuses it; the job's timeout bounds the build.
      - name: Cache an Artifact Signing token
        shell: pwsh
        run: az account get-access-token --resource https://codesigning.azure.net --output none
      - name: Build and sign installer
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTD_BUILD_ON_HOST: "1"
          AGENTD_RELEASE: ${{ needs.prepare.outputs.agentd_release }}
          T3CODE_DESKTOP_VERBOSE: "1"
          # Keeps win-unpacked, which is not copied to release/, for the signature check.
          T3CODE_DESKTOP_KEEP_STAGE: "1"
          T3CODE_DESKTOP_SIGNED: "true"
          # The certificate's CN; electron-builder also writes it to the updater config, which then
          # refuses an update signed by anyone else.
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: "Nebula Nova, Inc."
          AZURE_TRUSTED_SIGNING_ENDPOINT: https://eus.codesigning.azure.net/
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: agentd-next-signing
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: agentd-public
        run: bash agentd/scripts/build-desktop.sh win x64
      # electron-builder only warns when a file fails to sign.
      - name: Check the signatures
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signer = 'CN="Nebula Nova, Inc."'
          $failed = $false
          $files = @("release/LibraOS-Next-$env:VERSION-x64.exe")
          $tmp = [IO.Path]::GetTempPath()
          $stages = @(Get-ChildItem -LiteralPath $tmp -Directory -Filter 't3code-desktop-win-stage-*')
          if ($stages.Count -eq 1) {
            $unpacked = Join-Path $stages[0].FullName 'app/dist/win-unpacked'
            $files += Join-Path $unpacked 'LibraOS Next.exe'
          } else {
            Write-Output "::error::expected one kept build stage in $tmp, found $($stages.Count)"
            $failed = $true
          }
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) {
              Write-Output "::error::missing $file"
              $failed = $true
              continue
            }
            $sig = Get-AuthenticodeSignature -LiteralPath $file
            $subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '(none)' }
            Write-Output "${file}: $($sig.Status), signer $subject"
            if ($sig.Status -ne 'Valid' -or -not $subject.Contains($signer)) {
              Write-Output "::error::$file is not validly signed by $signer"
              $failed = $true
            }
          }
          # Information only: the other binaries electron-builder signs (signExts).
          if ($stages.Count -eq 1 -and (Test-Path -LiteralPath $unpacked)) {
            $unsigned = @(Get-ChildItem -LiteralPath $unpacked -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.dll', '.node' } |
              Where-Object { (Get-AuthenticodeSignature -LiteralPath $_.FullName).Status -ne 'Valid' })
            foreach ($file in $unsigned) { Write-Output "not signed: $($file.FullName)" }
            if ($unsigned.Count -gt 0) { Write-Output "::warning::$($unsigned.Count) binaries in win-unpacked are not signed" }
          }
          if ($failed) { exit 1 }
      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-win-x64
          path: |
            release/LibraOS-Next-${{ needs.prepare.outputs.version }}-*.exe
            release/LibraOS-Next-*.blockmap
            release/latest*.yml
          if-no-files-found: error
          compression-level: 0

  checksums:
    name: SHA256SUMS
    needs: [prepare, build, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      # The updater reads one latest-mac.yml and picks the file for its arch.
      - name: Merge the macOS updater manifests
        run: |
          node scripts/merge-update-manifests.ts --platform mac \
            dist/latest-mac.yml dist/latest-mac-x64.yml dist/latest-mac.yml
          rm dist/latest-mac-x64.yml
      - name: Check every installer and manifest is there and write SHA256SUMS
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd dist
          for f in LibraOS-Next-x86_64.AppImage "LibraOS-Next-$VERSION-amd64.deb" \
            "LibraOS-Next-$VERSION-x64.exe" "LibraOS-Next-$VERSION-arm64.dmg" \
            "LibraOS-Next-$VERSION-x64.dmg" "LibraOS-Next-$VERSION-arm64.zip" \
            "LibraOS-Next-$VERSION-x64.zip" latest.yml latest-linux.yml latest-mac.yml; do
            test -s "$f" || { echo "::error::missing $f"; ls -l; exit 1; }
          done
          for m in latest.yml latest-linux.yml latest-mac.yml; do
            grep -Eq "^version: '?$VERSION'?\$" "$m" || { echo "::error::$m is not $VERSION"; cat "$m"; exit 1; }
          done
          sha256sum LibraOS-Next-* > SHA256SUMS
          cat SHA256SUMS latest-mac.yml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            dist/LibraOS-Next-*
            dist/latest*.yml
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  release:
    name: Draft release
    if: github.event_name == 'push'
    needs: [prepare, checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          AGENTD_RELEASE: ${{ needs.prepare.outputs.agentd_release }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          # The app's update prompt lists the notes' last lines first, each cut at 220 characters
          # (apps/desktop/src/updates/releaseNotes.ts), so AgentD Next installs read the last line.
          cat > notes.md <<EOF
          LibraOS Next $VERSION, with LibraOS Engine (agentd) $AGENTD_RELEASE and its Skills inside.

          **Which file to download**

          - macOS, Apple silicon (M1 or later): \`LibraOS-Next-$VERSION-arm64.dmg\`
          - macOS, Intel: \`LibraOS-Next-$VERSION-x64.dmg\`
          - Windows: \`LibraOS-Next-$VERSION-x64.exe\`
          - Linux: \`LibraOS-Next-x86_64.AppImage\`, or \`LibraOS-Next-$VERSION-amd64.deb\` on Debian and Ubuntu

          Not sure which Mac you have? Apple menu → About This Mac: "Chip: Apple M…" is Apple silicon, "Processor: Intel" is Intel.
          The \`.zip\`, \`.blockmap\` and \`latest*.yml\` files are for automatic updates; you don't need them.

          **Signing**

          - **Windows:** the installer is signed by Nebula Nova, Inc. SmartScreen may still warn for a while after a release.
          - **macOS:** the app is not notarized yet. The first time, right-click LibraOS Next in Applications and choose Open, or open System Settings → Privacy & Security and click Open Anyway.

          The app checks for updates at launch and every four hours and asks before installing. On macOS it opens this page instead; install the new version by hand. 0.1.10-agentd.8 and earlier do not check: install this version by hand once.

          Coming from AgentD Next (the earlier name)? Its update installs LibraOS Next in its place: on Windows AgentD Next is uninstalled, the AppImage is replaced in the same file, and the .deb removes the \`agentd-desktop\` package (start LibraOS Next from the applications menu afterwards). On macOS, install LibraOS Next from this page and delete AgentD Next from Applications. The first start copies AgentD Next's window settings and sign-in; threads, settings and the background service carry over, and AgentD Next's own data is left in place.

          Check a download against \`SHA256SUMS\`.

          AgentD Next is now LibraOS Next. On Windows and Linux this update installs LibraOS Next in its place; on macOS, download it from this page. Your threads and settings carry over.
          EOF
          gh release create "$TAG" -R "$REPO" --draft --verify-tag \
            --title "LibraOS Next $VERSION" --notes-file notes.md \
            LibraOS-Next-* latest*.yml SHA256SUMS
